<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>The Air Show · 航空商业深度双语精读</title>
  <meta name="description" content="The Air Show 播客双语精读与音频同步播放器 - 深度解析全球民航机队、航线网络与航空财经商业动态。" />

  <style>
    /* ==========================================================================
       1. CSS Variables & Theme Configuration
       Aviation Financial Magazine Aesthetic (The Air Current / Substack Style)
       ========================================================================== */
    :root {
      --navy-950: #051329;
      --navy-900: #0a2540;
      --navy-800: #0e355c;
      --navy-700: #1a4975;
      --sky-500: #0284c7;
      --sky-400: #38bdf8;
      --sky-100: #e0f2fe;
      --sky-50: #f0f9ff;
      
      --bg-page: #f8fafc;
      --bg-surface: #ffffff;
      --bg-surface-elevated: #ffffff;
      --bg-subtle: #f1f5f9;
      --bg-active-row: #f0f7ff;
      
      --border-color: #e2e8f0;
      --border-hover: #cbd5e1;
      --border-active: #0284c7;
      
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --text-navy: #0a2540;
      
      --accent-primary: #0a2540;
      --accent-blue: #0284c7;
      --accent-badge-bg: #e0f2fe;
      --accent-badge-text: #0369a1;
      
      /* Speaker Badges */
      --spk-jon-bg: #e0e7ff;
      --spk-jon-text: #312e81;
      --spk-jon-border: #c7d2fe;
      
      --spk-brian-bg: #d1fae5;
      --spk-brian-text: #064e3b;
      --spk-brian-border: #a7f3d0;
      
      --spk-brett-bg: #ffedd5;
      --spk-brett-text: #9a3412;
      --spk-brett-border: #fed7aa;
      
      --spk-guest-bg: #f3e8ff;
      --spk-guest-text: #6b21a8;
      --spk-guest-border: #e9d5ff;

      --shadow-sm: 0 1px 3px rgba(10, 37, 64, 0.05);
      --shadow-md: 0 4px 12px -2px rgba(10, 37, 64, 0.07), 0 2px 6px -1px rgba(10, 37, 64, 0.04);
      --shadow-lg: 0 12px 24px -4px rgba(10, 37, 64, 0.09), 0 4px 10px -2px rgba(10, 37, 64, 0.04);
      --shadow-player: 0 -4px 24px rgba(10, 37, 64, 0.08);

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      
      --content-max-w: 920px;
      --header-h: 64px;
      --player-h: 88px;
    }

    [data-theme="dark"] {
      --bg-page: #070d18;
      --bg-surface: #0f172a;
      --bg-surface-elevated: #1e293b;
      --bg-subtle: #172236;
      --bg-active-row: #142844;
      
      --border-color: #1e293b;
      --border-hover: #334155;
      --border-active: #38bdf8;
      
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --text-navy: #e2e8f0;
      
      --accent-primary: #38bdf8;
      --accent-blue: #38bdf8;
      --accent-badge-bg: #0c4a6e;
      --accent-badge-text: #7dd3fc;
      
      /* Speaker Badges (Dark Mode) */
      --spk-jon-bg: #1e1b4b;
      --spk-jon-text: #a5b4fc;
      --spk-jon-border: #312e81;
      
      --spk-brian-bg: #064e3b;
      --spk-brian-text: #6ee7b7;
      --spk-brian-border: #047857;
      
      --spk-brett-bg: #431407;
      --spk-brett-text: #fdba74;
      --spk-brett-border: #7c2d12;
      
      --spk-guest-bg: #3b0764;
      --spk-guest-text: #d8b4fe;
      --spk-guest-border: #581c87;

      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 12px 28px rgba(0, 0, 0, 0.5);
      --shadow-player: 0 -4px 24px rgba(0, 0, 0, 0.45);
    }

    /* ==========================================================================
       2. Reset & Typography
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-bottom: calc(var(--player-h) + 60px); /* Avoid floating player overlap */
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* Editorial serif typography for headings */
    h1, h2, h3, .magazine-title {
      font-family: "Charter", "Source Serif 4", "Newsreader", "Georgia", "Cambria", serif;
      color: var(--text-navy);
      font-weight: 700;
      letter-spacing: -0.015em;
    }

    a {
      color: var(--accent-blue);
      text-decoration: none;
      transition: color 0.15s ease;
    }
    a:hover {
      text-decoration: underline;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: transparent;
      color: inherit;
    }

    /* ==========================================================================
       3. Header & Navigation Bar
       ========================================================================== */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 90;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .header-top {
      max-width: var(--content-max-w);
      margin: 0 auto;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }
    .brand-icon {
      width: 32px;
      height: 32px;
      background: var(--navy-900);
      color: #ffffff;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(10, 37, 64, 0.25);
    }
    [data-theme="dark"] .brand-icon {
      background: var(--sky-500);
      color: #070d18;
    }
    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-navy);
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .brand-sub {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-blue);
      background: var(--accent-badge-bg);
      padding: 2px 7px;
      border-radius: var(--radius-full);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-toggle-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-surface);
      color: var(--text-secondary);
      transition: all 0.15s ease;
    }
    .theme-toggle-btn:hover {
      background: var(--bg-subtle);
      color: var(--text-primary);
      border-color: var(--border-hover);
    }

    /* Sub-header Controls Bar */
    .controls-bar {
      border-top: 1px solid var(--border-color);
      background: var(--bg-surface);
    }
    .controls-inner {
      max-width: var(--content-max-w);
      margin: 0 auto;
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .episode-picker-wrap {
      flex: 1 1 280px;
      position: relative;
      display: flex;
      align-items: center;
    }
    .episode-select {
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 8px 36px 8px 12px;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-primary);
      outline: none;
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .episode-select:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }
    .select-arrow {
      position: absolute;
      right: 12px;
      pointer-events: none;
      color: var(--text-muted);
    }

    .filter-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    /* Bilingual View Segmented Controls */
    .segmented-control {
      display: inline-flex;
      background: var(--bg-subtle);
      padding: 3px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
    }
    .segment-btn {
      padding: 5px 12px;
      font-size: 0.8125rem;
      font-weight: 600;
      border-radius: 6px;
      color: var(--text-secondary);
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .segment-btn:hover {
      color: var(--text-primary);
    }
    .segment-btn.active {
      background: var(--bg-surface);
      color: var(--navy-900);
      box-shadow: var(--shadow-sm);
    }
    [data-theme="dark"] .segment-btn.active {
      background: var(--bg-surface-elevated);
      color: var(--sky-400);
    }

    /* Search Box */
    .search-box-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-icon {
      position: absolute;
      left: 10px;
      pointer-events: none;
      color: var(--text-muted);
    }
    .search-input {
      width: 190px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 7px 30px 7px 32px;
      font-size: 0.8125rem;
      color: var(--text-primary);
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      width: 230px;
      border-color: var(--accent-blue);
      background: var(--bg-surface);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }
    .search-clear-btn {
      position: absolute;
      right: 8px;
      width: 18px;
      height: 18px;
      display: none;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      border-radius: 50%;
    }
    .search-clear-btn:hover {
      color: var(--text-primary);
    }

    /* ==========================================================================
       4. Main Layout & Magazine Article Elements
       ========================================================================== */
    .main-content {
      max-width: var(--content-max-w);
      margin: 0 auto;
      padding: 28px 20px;
      width: 100%;
      flex: 1;
    }

    /* Search result indicator */
    .search-stats-banner {
      display: none;
      background: var(--accent-badge-bg);
      color: var(--accent-badge-text);
      padding: 8px 16px;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 20px;
      align-items: center;
      justify-content: space-between;
    }
    .search-stats-banner.visible {
      display: flex;
    }

    /* Article Meta & Title */
    .article-header {
      margin-bottom: 32px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 24px;
    }
    .article-meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      font-size: 0.8125rem;
      color: var(--text-secondary);
      margin-bottom: 12px;
      font-weight: 500;
    }
    .meta-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      padding: 2px 10px;
      border-radius: var(--radius-full);
    }
    .meta-bullet {
      color: var(--text-muted);
    }

    .article-title {
      font-size: 2.2rem;
      line-height: 1.25;
      margin-bottom: 12px;
      color: var(--text-navy);
    }
    @media (max-width: 640px) {
      .article-title {
        font-size: 1.65rem;
      }
    }

    /* Section Styling */
    .section-wrap {
      margin-bottom: 40px;
    }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .section-title {
      font-size: 1.35rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-badge {
      font-size: 0.75rem;
      font-weight: 600;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      background: var(--bg-subtle);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
    }

    /* Executive Summary Card */
    .summary-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--navy-900);
      border-radius: var(--radius-md);
      padding: 22px 26px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
    }
    [data-theme="dark"] .summary-card {
      border-left-color: var(--sky-400);
    }
    .summary-lead {
      font-size: 1.0625rem;
      line-height: 1.85;
      color: var(--text-primary);
      text-align: justify;
    }

    /* Key Takeaways Grid */
    .takeaways-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 20px 24px;
      box-shadow: var(--shadow-sm);
    }
    .takeaways-heading {
      font-size: 0.9375rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .takeaways-list {
      list-style: none;
      display: grid;
      gap: 12px;
    }
    .takeaway-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-primary);
    }
    .takeaway-num {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: var(--radius-full);
      background: var(--accent-badge-bg);
      color: var(--accent-badge-text);
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }

    /* ==========================================================================
       5. Highlights (Key Moments) Grid
       ========================================================================== */
    .highlights-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 16px;
    }
    @media (max-width: 640px) {
      .highlights-grid {
        grid-template-columns: 1fr;
      }
    }

    .highlight-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 10px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .highlight-card:hover {
      border-color: var(--accent-blue);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .highlight-card.active {
      border-color: var(--accent-blue);
      background: var(--bg-active-row);
      box-shadow: 0 0 0 1px var(--accent-blue), var(--shadow-md);
    }

    .highlight-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .timestamp-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--navy-900);
      color: #ffffff;
      padding: 3px 9px;
      border-radius: var(--radius-full);
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      transition: background-color 0.15s ease;
    }
    .highlight-card:hover .timestamp-badge {
      background: var(--accent-blue);
    }
    [data-theme="dark"] .timestamp-badge {
      background: var(--sky-500);
      color: #070d18;
    }

    .playing-indicator {
      display: none;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--accent-blue);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      align-items: center;
      gap: 5px;
    }
    .highlight-card.active .playing-indicator {
      display: inline-flex;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background: var(--accent-blue);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .highlight-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-navy);
      line-height: 1.4;
    }
    .highlight-summary {
      font-size: 0.875rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    .highlight-quote {
      font-size: 0.8125rem;
      color: var(--text-muted);
      font-style: italic;
      line-height: 1.5;
      padding-left: 10px;
      border-left: 2px solid var(--border-color);
      margin-top: 4px;
    }

    /* ==========================================================================
       6. Bilingual Transcript Section
       ========================================================================== */
    .transcript-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .transcript-item {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
      position: relative;
      transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .transcript-item:hover {
      border-color: var(--border-hover);
      background: var(--bg-subtle);
    }
    .transcript-item.active {
      border-left: 4px solid var(--accent-blue);
      background: var(--bg-active-row);
      border-color: var(--border-hover);
      box-shadow: var(--shadow-sm);
    }

    .transcript-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .meta-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .speaker-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: var(--radius-full);
      border: 1px solid transparent;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .spk-jon {
      background: var(--spk-jon-bg);
      color: var(--spk-jon-text);
      border-color: var(--spk-jon-border);
    }
    .spk-brian {
      background: var(--spk-brian-bg);
      color: var(--spk-brian-text);
      border-color: var(--spk-brian-border);
    }
    .spk-brett {
      background: var(--spk-brett-bg);
      color: var(--spk-brett-text);
      border-color: var(--spk-brett-border);
    }
    .spk-guest {
      background: var(--spk-guest-bg);
      color: var(--spk-guest-text);
      border-color: var(--spk-guest-border);
    }

    .time-seek-btn {
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: var(--bg-subtle);
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    .time-seek-btn:hover,
    .transcript-item:hover .time-seek-btn {
      color: #ffffff;
      background: var(--accent-blue);
    }
    .transcript-item.active .time-seek-btn {
      background: var(--accent-blue);
      color: #ffffff;
      font-weight: 600;
    }

    .transcript-en {
      font-size: 0.96875rem;
      line-height: 1.65;
      color: var(--text-secondary);
      font-family: "Charter", "Georgia", serif;
    }
    .transcript-zh {
      font-size: 0.984375rem;
      line-height: 1.75;
      color: var(--text-primary);
    }

    /* Language View Mode visibility rules */
    [data-lang-mode="zh"] .transcript-en {
      display: none !important;
    }
    [data-lang-mode="en"] .transcript-zh {
      display: none !important;
    }

    /* Search match & filter */
    mark.search-match {
      background: #fef08a;
      color: #713f12;
      padding: 1px 3px;
      border-radius: 3px;
      font-weight: 600;
    }
    [data-theme="dark"] mark.search-match {
      background: #854d0e;
      color: #fef08a;
    }
    .is-search-hidden {
      display: none !important;
    }

    /* ==========================================================================
       7. Floating Audio Bar (Bottom Sticky)
       ========================================================================== */
    .audio-player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;

        const pad = n => String(n).padStart(2, '0');
        if (hrs > 0) {
          return `${hrs}:${pad(mins)}:${pad(secs)}`;
        }
        return `${pad(mins)}:${pad(secs)}`;
      }

      /**
       * Format seconds into human readable duration e.g. "35分20秒"
       */
      function formatDurationZh(seconds) {
        if (isNaN(seconds) || seconds < 0) return '0秒';
        const totalSecs = Math.floor(seconds);
        const hrs = Math.floor(totalSecs / 3600);
        const mins = Math.floor((totalSecs % 3600) / 60);
        const secs = totalSecs % 60;
        if (hrs > 0) {
          return `${hrs}小时${mins}分${secs}秒`;
        }
        return `${mins}分${secs}秒`;
      }

      /**
       * Format ISO pub_date e.g. "2026年11月19日"
       */
      function formatDateZh(isoStr) {
        if (!isoStr) return '';
        try {
          const d = new Date(isoStr);
          if (isNaN(d.getTime())) return isoStr.slice(0, 10);
          return `${d.getUTCFullYear()}年${d.getUTCMonth() + 1}月${d.getUTCDate()}日`;
        } catch {
          return String(isoStr).slice(0, 10);
        }
      }

      /**
       * Map speaker name to specific CSS class
       */
      function getSpeakerCssClass(speaker) {
        if (!speaker) return 'spk-guest';
        const s = speaker.toLowerCase();
        if (s.includes('jon') || s.includes('ostrower')) return 'spk-jon';
        if (s.includes('brian') || s.includes('sumers')) return 'spk-brian';
        if (s.includes('brett') || s.includes('snyder')) return 'spk-brett';
        return 'spk-guest';
      }

      /**
       * Binary search helper: finds the largest index where start_sec <= currentTime
       */
      function binarySearchActiveIndex(items, currentTime) {
        if (!items || items.length === 0) return -1;
        let low = 0;
        let high = items.length - 1;
        let result = -1;
        while (low <= high) {
          const mid = Math.floor((low + high) / 2);
          if (items[mid].start_sec <= currentTime) {
            result = mid;
            low = mid + 1;
          } else {
            high = mid - 1;
          }
        }
        return result;
      }

      /**
       * Robust Seek and Play wrapper
       * Handles browser readyState < 1 by attaching a one-time loadedmetadata listener
       */
      function seekAndPlay(targetSec) {
        targetSec = Math.max(0, Number(targetSec) || 0);
        console.log(`[AIRSHOW][UI] Seeking to ${targetSec}s (readyState: ${audio.readyState})`);

        const executeSeekAndPlay = () => {
          try {
            audio.currentTime = targetSec;
          } catch (err) {
            console.warn('[AIRSHOW][UI] Setting currentTime failed:', err);
          }
          const playPromise = audio.play();
          if (playPromise !== undefined) {
            playPromise.catch(err => {
              console.warn('[AIRSHOW][UI] Play call rejected/interrupted:', err);
            });
          }
        };

        if (audio.readyState < 1) {
          console.log('[AIRSHOW][UI] Audio metadata not ready, waiting for loadedmetadata event...');
          audio.addEventListener('loadedmetadata', function onLoaded() {
            audio.removeEventListener('loadedmetadata', onLoaded);
            executeSeekAndPlay();
          }, { once: true });

          if (audio.networkState === HTMLMediaElement.NETWORK_EMPTY) {
            audio.load();
          }
        } else {
          executeSeekAndPlay();
        }
      }

      // ======================================================================
      // Theme & Preference Management
      // ======================================================================

      function initTheme() {
        const savedTheme = localStorage.getItem('airshow_theme');
        const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
        applyTheme(theme);
      }

      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('airshow_theme', theme);
        if (theme === 'dark') {
          iconSun.style.display = 'block';
          iconMoon.style.display = 'none';
        } else {
          iconSun.style.display = 'none';
          iconMoon.style.display = 'block';
        }
      }

      themeToggleBtn.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
        const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
        applyTheme(nextTheme);
        console.log(`[AIRSHOW][UI] Theme toggled to: ${nextTheme}`);
      });

      // ======================================================================
      // Language Display Mode Switcher
      // ======================================================================

      function initLanguageMode() {
        const savedMode = localStorage.getItem('airshow_lang_mode') || 'bilingual';
        setLanguageMode(savedMode);

        document.querySelectorAll('.segment-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const mode = btn.getAttribute('data-mode');
            setLanguageMode(mode);
          });
        });
      }

      function setLanguageMode(mode) {
        currentLangMode = mode;
        document.body.setAttribute('data-lang-mode', mode);
        localStorage.setItem('airshow_lang_mode', mode);

        document.querySelectorAll('.segment-btn').forEach(btn => {
          if (btn.getAttribute('data-mode') === mode) {
            btn.classList.add('active');

        });
        console.log(`[AIRSHOW][UI] Language mode changed to: ${mode}`);

      // ======================================================================
      // Data Fetching & Rendering (v2.0 On-Demand Lazy Architecture)
      // ======================================================================

      async function loadIndexData() {
        console.log('[AIRSHOW][UI] Fetching ./data/index.json...');
        loadingState.style.display = 'flex';
        errorState.style.display = 'none';
        episodeContent.style.display = 'none';

        try {
          const response = await fetch('./data/index.json', { cache: 'no-cache' });
          if (!response.ok) {
            throw new Error(`HTTP ${response.status} ${response.statusText}`);
          }
          const data = await response.json();
          appData = data;
          console.log(`[AIRSHOW][UI] Successfully loaded index with ${data.episodes ? data.episodes.length : 0} episodes (schema: ${data.schema_version})`);

          if (!data.episodes || data.episodes.length === 0) {
            throw new Error('index.json 中未包含任何播客单集数据');
          }

          populateEpisodeDropdown(data.episodes);

          // Support URL hash or default to latest episode (item 0)
          const hashGuid = window.location.hash.replace(/^#/, '');
          const initialEp = (hashGuid && data.episodes.find(ep => ep.guid === hashGuid)) || data.episodes[0];
          selectEpisode(initialEp);

          loadingState.style.display = 'none';
          episodeContent.style.display = 'block';
          playerBar.style.display = 'block';
        } catch (err) {
          console.error('[AIRSHOW][UI] Failed to load index data:', err);
          loadingState.style.display = 'none';
          errorState.style.display = 'flex';
          errorMessage.textContent = `加载失败：${err.message}。请确认已在 docs 目录下运行静态服务器。`;
        }
      }

      btnRetry.addEventListener('click', loadIndexData);

      function populateEpisodeDropdown(episodes) {
        episodeSelect.innerHTML = '';
        episodes.forEach((ep) => {
          const opt = document.createElement('option');
          opt.value = ep.guid;
          const countStr = ep.transcript_count != null ? ` · ${ep.transcript_count}条` : '';
          opt.textContent = `${formatDateZh(ep.pub_date)} · ${formatDurationZh(ep.duration_sec)}${countStr} | ${ep.title}`;
          episodeSelect.appendChild(opt);
        });
      }

      function selectEpisode(epMeta) {
        currentLoadingGuid = epMeta.guid;
        currentRequestSeq++;
        const thisSeq = currentRequestSeq;

        console.log(`[AIRSHOW][UI] Selected episode: "${epMeta.title}" (${epMeta.guid})`);

        // Update dropdown selected value
        episodeSelect.value = epMeta.guid;

        // Sync URL Hash without triggering page scroll
        if (window.location.hash.replace(/^#/, '') !== epMeta.guid) {
          history.replaceState(null, '', '#' + epMeta.guid);
        }

        // Reset player & state (pause previous episode playback and reset highlight indices)
        audio.pause();
        audio.src = epMeta.audio_url || '';
        audio.load();
        lastActiveTranscriptIndex = -1;
        lastActiveHighlightIndex = -1;
        timeCurrent.textContent = '00:00';
        timeTotal.textContent = formatTime(epMeta.duration_sec || 0);
        seekSlider.value = 0;
        seekSlider.max = epMeta.duration_sec || 100;
        playerEpTitle.textContent = epMeta.title || '';
        playerSpeakerName.textContent = '就绪';
        updatePlayPauseIcons(false);

        // Immediately render metadata and summary from index.json
        renderArticleMeta(epMeta);
        renderExecutiveSummary(epMeta);

        // In-memory cache hit branch
        if (episodeCache.has(epMeta.guid)) {
          console.log(`[AIRSHOW][UI] Cache hit for ${epMeta.guid}`);
          const detail = episodeCache.get(epMeta.guid);
          currentEpisode = detail;
          renderHighlights(detail.highlights || []);
          renderTranscript(detail.transcript || []);

          // Link search state: re-apply filter and highlighting if search input is non-empty
          const q = searchInput.value.trim();
          if (q) {
            applySearchFilter(q);
          } else {
            applySearchFilter('');
          }
          return;
        }

        // Cache miss: show concise loading indicator in Highlights and Transcript areas, then fetch
        loadEpisodeDetail(epMeta, thisSeq);
      }

      async function loadEpisodeDetail(epMeta, seq) {
        currentEpisode = {
          ...epMeta,
          highlights: [],
          transcript: []
        };
        highlightElements = [];
        transcriptElements = [];

        highlightsCountBadge.textContent = epMeta.highlights_count != null ? `${epMeta.highlights_count} 个片段 (加载中)` : '加载中...';
        transcriptCountBadge.textContent = epMeta.transcript_count != null ? `${epMeta.transcript_count} 段落 (加载中)` : '加载中...';

        highlightsGrid.innerHTML = `
          <div class="state-banner" style="grid-column: 1 / -1; min-height: 120px; padding: 24px 0;">
            <div class="spinner" style="width: 28px; height: 28px;"></div>
            <p style="color: var(--text-secondary); font-size: 0.875rem;">正在按需加载精选重点...</p>
          </div>
        `;
        transcriptContainer.innerHTML = `
          <div class="state-banner" style="min-height: 160px; padding: 32px 0;">
            <div class="spinner" style="width: 28px; height: 28px;"></div>
            <p style="color: var(--text-secondary); font-size: 0.875rem;">正在按需加载双语逐字稿...</p>
          </div>
        `;

        try {
          const fileUrl = './data/' + epMeta.file;
          const response = await fetch(fileUrl, { cache: 'no-cache' });
          if (!response.ok) {
            throw new Error(`HTTP ${response.status} ${response.statusText}`);
          }
          const detail = await response.json();

          // Save to in-memory cache
          episodeCache.set(epMeta.guid, detail);
          console.log(`[AIRSHOW][UI] Loaded episode detail: ${epMeta.file}`);

          // Race condition check: verify if still the currently selected episode
          if (currentLoadingGuid !== epMeta.guid || seq !== currentRequestSeq) {
            console.log(`[AIRSHOW][UI] Stale response ignored for ${epMeta.guid}`);
            return;
          }

          currentEpisode = detail;
          renderHighlights(detail.highlights || []);
          renderTranscript(detail.transcript || []);

          // Link search state: re-apply filter and highlighting if search input is non-empty
          const q = searchInput.value.trim();
          if (q) {
            applySearchFilter(q);
          } else {
            applySearchFilter('');
          }
        } catch (err) {
          console.error(`[AIRSHOW][UI] Failed to load detail for ${epMeta.guid}:`, err);
          if (currentLoadingGuid !== epMeta.guid || seq !== currentRequestSeq) {
            return;
          }

          highlightsCountBadge.textContent = '加载失败';
          transcriptCountBadge.textContent = '加载失败';
          highlightsGrid.innerHTML = '';
          transcriptContainer.innerHTML = `
            <div class="state-banner" style="min-height: 160px; gap: 12px; padding: 24px 0;">
              <h4 style="color: #ef4444; font-size: 1rem;">单集详情加载失败</h4>
              <p style="color: var(--text-secondary); font-size: 0.875rem;">${escapeHtml(err.message)}</p>
              <button type="button" class="btn-retry" id="btn-retry-detail" style="padding: 6px 18px; font-size: 0.8125rem;">重试加载详情</button>
            </div>
          `;
          const btnRetryDetail = document.getElementById('btn-retry-detail');
          if (btnRetryDetail) {
            btnRetryDetail.addEventListener('click', () => {
              selectEpisode(epMeta);
            });
          }
        }
      }

      function renderArticleMeta(ep) {
        metaPodcastTitle.textContent = appData.podcast_title || 'The Air Show';
        metaPubDate.textContent = formatDateZh(ep.pub_date);
        metaDuration.textContent = formatDurationZh(ep.duration_sec);
        metaAudioLink.href = ep.audio_url || '#';
        episodeTitle.textContent = ep.title || '';
      }

      function renderExecutiveSummary(ep) {
        // Summary text
        summaryZhText.textContent = ep.summary_zh || '暂无摘要';

        // Key takeaways list
        takeawaysList.innerHTML = '';
        const takeaways = ep.key_takeaways_zh || [];
        takeaways.forEach((item, idx) => {
          const li = document.createElement('li');
          li.className = 'takeaway-item';

          const num = document.createElement('span');
          num.className = 'takeaway-num';
          num.textContent = String(idx + 1).padStart(2, '0');

          const text = document.createElement('span');
          text.textContent = item;

          li.appendChild(num);
          li.appendChild(text);
          takeawaysList.appendChild(li);
        });
      }

      function renderHighlights(highlights) {
        highlightsGrid.innerHTML = '';
        highlightElements = [];
        highlightsCountBadge.textContent = `${highlights.length} 个片段`;

        highlights.forEach((hl, idx) => {
          const card = document.createElement('div');
          card.className = 'highlight-card';
          card.dataset.startSec = hl.start_sec;
          card.dataset.index = idx;

          // Header
          const header = document.createElement('div');
          header.className = 'highlight-header';

          const timeBadge = document.createElement('span');
          timeBadge.className = 'timestamp-badge';
          timeBadge.innerHTML = `
            <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            ${formatTime(hl.start_sec)}
          `;

          const playingIndicator = document.createElement('span');
          playingIndicator.className = 'playing-indicator';
          playingIndicator.innerHTML = '<span class="pulse-dot"></span> 正在播放';

          header.appendChild(timeBadge);
          header.appendChild(playingIndicator);
          card.appendChild(header);

          // Title
          const title = document.createElement('div');
          title.className = 'highlight-title';
          title.textContent = hl.title_zh || '';
          card.appendChild(title);

          // Summary
          const summary = document.createElement('div');
          summary.className = 'highlight-summary';
          summary.textContent = hl.summary_zh || '';
          card.appendChild(summary);

          // Quote
          if (hl.quote_en) {
            const quote = document.createElement('div');
            quote.className = 'highlight-quote';
            quote.textContent = `“${hl.quote_en}”`;
            card.appendChild(quote);
          }

          // Click to seek & play
          card.addEventListener('click', () => {
            seekAndPlay(hl.start_sec);
          });

          highlightsGrid.appendChild(card);
          highlightElements.push(card);
        });
      }

      function renderTranscript(transcript) {
        transcriptContainer.innerHTML = '';
        transcriptElements = [];
        transcriptCountBadge.textContent = `${transcript.length} 段落`;

        transcript.forEach((item, idx) => {
          const row = document.createElement('div');
          row.className = 'transcript-item';
          row.dataset.startSec = item.start_sec;
          row.dataset.index = idx;
          row.dataset.id = item.id;

          // Meta Row (Speaker + Time)
          const meta = document.createElement('div');
          meta.className = 'transcript-meta';

          const metaLeft = document.createElement('div');
          metaLeft.className = 'meta-left';

          const speaker = document.createElement('span');
          speaker.className = `speaker-badge ${getSpeakerCssClass(item.speaker)}`;
          speaker.textContent = item.speaker || 'Guest';
          metaLeft.appendChild(speaker);

          const timeBtn = document.createElement('button');
          timeBtn.type = 'button';
          timeBtn.className = 'time-seek-btn';
          timeBtn.title = `跳转至 ${formatTime(item.start_sec)}`;
          timeBtn.innerHTML = `
            <svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            ${formatTime(item.start_sec)}
          `;
          timeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            seekAndPlay(item.start_sec);
          });
          metaLeft.appendChild(timeBtn);
          meta.appendChild(metaLeft);
          row.appendChild(meta);

          // English original
          const enText = document.createElement('div');
          enText.className = 'transcript-en';
          enText.textContent = item.en || '';
          row.appendChild(enText);

          // Chinese translation
          const zhText = document.createElement('div');
          zhText.className = 'transcript-zh';
          zhText.textContent = item.zh || '';
          row.appendChild(zhText);

          // Whole row click seek
          row.addEventListener('click', () => {
            seekAndPlay(item.start_sec);
          });

          transcriptContainer.appendChild(row);
          transcriptElements.push(row);
        });
      }

      // ======================================================================
      // Audio Engine & Sync Highlighting Logic
      // ======================================================================

      function updatePlayPauseIcons(isPlaying) {
        if (isPlaying) {
          iconPlay.style.display = 'none';
          iconPause.style.display = 'block';
          btnPlayPause.setAttribute('aria-label', '暂停');
        } else {
          iconPlay.style.display = 'block';
          iconPause.style.display = 'none';
          btnPlayPause.setAttribute('aria-label', '播放');
        }
      }

      btnPlayPause.addEventListener('click', () => {
        if (!audio.src) return;
        if (audio.paused) {
          audio.play().catch(err => console.warn('[AIRSHOW][UI] Play rejected:', err));
        } else {
          audio.pause();
        }
      });

      audio.addEventListener('play', () => {
        updatePlayPauseIcons(true);
      });

      audio.addEventListener('pause', () => {
        updatePlayPauseIcons(false);
      });

      audio.addEventListener('ended', () => {
        updatePlayPauseIcons(false);
      });

      audio.addEventListener('loadedmetadata', () => {
        const dur = audio.duration || (currentEpisode ? currentEpisode.duration_sec : 0);
        timeTotal.textContent = formatTime(dur);
        seekSlider.max = dur;
      });

      // Synchronous Highlighting & Binary Search in timeupdate
      audio.addEventListener('timeupdate', () => {
        if (!currentEpisode) return;

        const curTime = audio.currentTime;

        // Update Slider and Time Display if not actively scrubbing
        if (!isScrubbing) {
          seekSlider.value = curTime;
          timeCurrent.textContent = formatTime(curTime);
        }

        // 1. Locate and highlight current Transcript item using Binary Search
        const activeTrIdx = binarySearchActiveIndex(currentEpisode.transcript, curTime);
        if (activeTrIdx !== lastActiveTranscriptIndex) {
          if (lastActiveTranscriptIndex !== -1 && transcriptElements[lastActiveTranscriptIndex]) {
            transcriptElements[lastActiveTranscriptIndex].classList.remove('active');
          }
          if (activeTrIdx !== -1 && transcriptElements[activeTrIdx]) {
            const activeTrEl = transcriptElements[activeTrIdx];
            activeTrEl.classList.add('active');

            // Auto-scroll if enabled
            if (isAutoScrollEnabled) {
              activeTrEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            // Update mini speaker info in player
            const speaker = currentEpisode.transcript[activeTrIdx].speaker || 'The Air Show';
            playerSpeakerName.textContent = speaker;
          }
          lastActiveTranscriptIndex = activeTrIdx;
        }

        // 2. Locate and highlight current Highlight Card using Binary Search
        const activeHlIdx = binarySearchActiveIndex(currentEpisode.highlights, curTime);
        if (activeHlIdx !== lastActiveHighlightIndex) {
          if (lastActiveHighlightIndex !== -1 && highlightElements[lastActiveHighlightIndex]) {
            highlightElements[lastActiveHighlightIndex].classList.remove('active');
          }
          if (activeHlIdx !== -1 && highlightElements[activeHlIdx]) {
            highlightElements[activeHlIdx].classList.add('active');
          }
          lastActiveHighlightIndex = activeHlIdx;
        }
      });

      // Scrubbing Event Handlers
      seekSlider.addEventListener('input', () => {
        isScrubbing = true;
        timeCurrent.textContent = formatTime(Number(seekSlider.value));
      });

      seekSlider.addEventListener('change', () => {
        isScrubbing = false;
        seekAndPlay(Number(seekSlider.value));
      });

      // Fast forward & rewind 15s
      btnRewind.addEventListener('click', () => {
        const target = Math.max(0, audio.currentTime - 15);
        seekAndPlay(target);
      });

      btnForward.addEventListener('click', () => {
        const maxSec = audio.duration || (currentEpisode ? currentEpisode.duration_sec : Infinity);
        const target = Math.min(maxSec, audio.currentTime + 15);
        seekAndPlay(target);
      });

      // Playback speed cycle
      btnSpeed.addEventListener('click', () => {
        currentRateIndex = (currentRateIndex + 1) % PLAYBACK_RATES.length;
        const newRate = PLAYBACK_RATES[currentRateIndex];
        audio.playbackRate = newRate;
        btnSpeed.textContent = `${newRate.toFixed(1)}x`;
        btnSpeed.setAttribute('aria-label', `播放倍速 ${newRate.toFixed(1)}x`);
        console.log(`[AIRSHOW][UI] Playback rate set to: ${newRate}x`);
      });

      // Auto-scroll toggle
      btnAutoscroll.addEventListener('click', () => {
        isAutoScrollEnabled = !isAutoScrollEnabled;
        btnAutoscroll.classList.toggle('active', isAutoScrollEnabled);
        console.log(`[AIRSHOW][UI] Auto-scroll enabled: ${isAutoScrollEnabled}`);
        if (isAutoScrollEnabled && lastActiveTranscriptIndex !== -1 && transcriptElements[lastActiveTranscriptIndex]) {
          transcriptElements[lastActiveTranscriptIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      });

      // ======================================================================
      // Keyword Search & Filtering (Safe Escaped Highlight)
      // ======================================================================

      function highlightTextMatches(rawText, query) {
        if (!query || !rawText) return escapeHtml(rawText);
        const escapedQ = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(`(${escapedQ})`, 'gi');
        const parts = rawText.split(regex);
        return parts.map(part => {
          if (part.toLowerCase() === query.toLowerCase()) {
            return `<mark class="search-match">${escapeHtml(part)}</mark>`;
          }
          return escapeHtml(part);
        }).join('');
      }

      function applySearchFilter(query) {
        if (!currentEpisode) return;

        if (!query) {
          searchClearBtn.style.display = 'none';
          searchStatsBanner.classList.remove('visible');

          // Reset transcript
          transcriptElements.forEach((el, idx) => {
            el.classList.remove('is-search-hidden');
            const item = (currentEpisode.transcript || [])[idx];
            if (item) {
              const enEl = el.querySelector('.transcript-en');
              const zhEl = el.querySelector('.transcript-zh');
              if (enEl) enEl.innerHTML = escapeHtml(item.en);
              if (zhEl) zhEl.innerHTML = escapeHtml(item.zh);
            }
          });

          // Reset highlights
          highlightElements.forEach((el, idx) => {
            el.classList.remove('is-search-hidden');
            const item = (currentEpisode.highlights || [])[idx];
            if (item) {
              const titleEl = el.querySelector('.highlight-title');
              const summaryEl = el.querySelector('.highlight-summary');
              if (titleEl) titleEl.innerHTML = escapeHtml(item.title_zh);
              if (summaryEl) summaryEl.innerHTML = escapeHtml(item.summary_zh);
              const quoteEl = el.querySelector('.highlight-quote');
              if (quoteEl && item.quote_en) {
                quoteEl.innerHTML = `“${escapeHtml(item.quote_en)}”`;
              }
            }
          });
          return;
        }

        searchClearBtn.style.display = 'flex';
        const qLower = query.toLowerCase();
        let transcriptMatchCount = 0;
        let highlightMatchCount = 0;

        // Filter and highlight transcripts
        transcriptElements.forEach((el, idx) => {
          const item = (currentEpisode.transcript || [])[idx];
          if (!item) return;
          const matchEn = (item.en || '').toLowerCase().includes(qLower);
          const matchZh = (item.zh || '').toLowerCase().includes(qLower);
          const matchSpk = (item.speaker || '').toLowerCase().includes(qLower);

          if (matchEn || matchZh || matchSpk) {
            transcriptMatchCount++;
            el.classList.remove('is-search-hidden');
            const enEl = el.querySelector('.transcript-en');
            const zhEl = el.querySelector('.transcript-zh');
            if (enEl) enEl.innerHTML = highlightTextMatches(item.en, query);
            if (zhEl) zhEl.innerHTML = highlightTextMatches(item.zh, query);
          } else {
            el.classList.add('is-search-hidden');
          }
        });

        // Filter and highlight highlights
        highlightElements.forEach((el, idx) => {
          const item = (currentEpisode.highlights || [])[idx];
          if (!item) return;
          const matchTitle = (item.title_zh || '').toLowerCase().includes(qLower);
          const matchSummary = (item.summary_zh || '').toLowerCase().includes(qLower);
          const matchQuote = (item.quote_en || '').toLowerCase().includes(qLower);

          if (matchTitle || matchSummary || matchQuote) {
            highlightMatchCount++;
            el.classList.remove('is-search-hidden');
            const titleEl = el.querySelector('.highlight-title');
            const summaryEl = el.querySelector('.highlight-summary');
            if (titleEl) titleEl.innerHTML = highlightTextMatches(item.title_zh, query);
            if (summaryEl) summaryEl.innerHTML = highlightTextMatches(item.summary_zh, query);
            const quoteEl = el.querySelector('.highlight-quote');
            if (quoteEl && item.quote_en) {
              quoteEl.innerHTML = `“${highlightTextMatches(item.quote_en, query)}”`;
            }
          } else {
            el.classList.add('is-search-hidden');
          }
        });

        const totalMatches = transcriptMatchCount + highlightMatchCount;
        searchStatsText.textContent = `关键词 “${query}”：匹配 ${transcriptMatchCount} 段逐字稿，${highlightMatchCount} 条精选重点`;
        searchStatsBanner.classList.add('visible');
        console.log(`[AIRSHOW][UI] Search filter applied: "${query}" (total ${totalMatches} items matched)`);
      }

      let searchDebounceTimer = null;
      searchInput.addEventListener('input', () => {
        clearTimeout(searchDebounceTimer);
        searchDebounceTimer = setTimeout(() => {
          applySearchFilter(searchInput.value.trim());
        }, 150);
      });

      searchClearBtn.addEventListener('click', () => {
        searchInput.value = '';
        applySearchFilter('');
        searchInput.focus();
      });

      searchResetLink.addEventListener('click', () => {
        searchInput.value = '';
        applySearchFilter('');
      });

      // Episode dropdown change listener
      episodeSelect.addEventListener('change', (e) => {
        const selectedGuid = e.target.value;
        if (!appData || !appData.episodes) return;
        const found = appData.episodes.find(ep => ep.guid === selectedGuid);
        if (found) {
          selectEpisode(found);
        }
      });

      // Window hashchange listener for browser back/forward or direct link navigation
      window.addEventListener('hashchange', () => {
        const hashGuid = window.location.hash.replace(/^#/, '');
        if (hashGuid && hashGuid !== currentLoadingGuid && appData && appData.episodes) {
          const found = appData.episodes.find(ep => ep.guid === hashGuid);
          if (found) {
            selectEpisode(found);
          }
        }
      });

      // ======================================================================
      // Initialization
      // ======================================================================
      initTheme();
      initLanguageMode();
      loadIndexData();

    })();
  </script>
</body>
</html>
