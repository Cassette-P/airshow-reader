name: Scheduled Update and Ingestion

'on':
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      show:
        description: 'Target show to process (or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'airshow'
          - 'sinica'
          - 'tal'
      limit:
        description: 'Number of new episodes to process'
        required: false
        default: '1'
        type: string
      max_age_days:
        description: 'Max age of episodes in days (blank = per-show default, 0 = no limit)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run mode (do not call Gemini API or save data)'
        required: false
        default: false
        type: boolean
      enrich_only:
        description: 'Run --enrich backfill for existing episodes only'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: airshow-reader-update
  cancel-in-progress: false

jobs:
  update-episodes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies & ffmpeg
        run: |
          pip install -r requirements.txt
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Run processing pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_CH_B: ${{ secrets.GEMINI_API_KEY_CH_B }}
          GEMINI_MODEL_CH_B: ${{ vars.GEMINI_MODEL_CH_B }}
          GEMINI_MODEL_CH_A: ${{ vars.GEMINI_MODEL_CH_A }}
          GEMINI_MODEL_ENRICH: ${{ vars.GEMINI_MODEL_ENRICH }}
          GEMINI_THINKING_CH_B: ${{ vars.GEMINI_THINKING_CH_B }}
          GEMINI_THINKING_CH_A: ${{ vars.GEMINI_THINKING_CH_A }}
          GEMINI_THINKING_ENRICH: ${{ vars.GEMINI_THINKING_ENRICH }}
          CHUNK_SLEEP_SEC: ${{ vars.CHUNK_SLEEP_SEC }}
          CH_B_CHUNK_SEC: ${{ vars.CH_B_CHUNK_SEC }}
          CH_B_FREE_RPM: ${{ vars.CH_B_FREE_RPM }}
          CH_B_FREE_RPD: ${{ vars.CH_B_FREE_RPD }}
          CH_B_FREE_OVERFLOW_TO_PAID: ${{ vars.CH_B_FREE_OVERFLOW_TO_PAID }}
          CH_A_BG_TIMEOUT_SEC: ${{ vars.CH_A_BG_TIMEOUT_SEC }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHOW: ${{ inputs.show }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_MAX_AGE_DAYS: ${{ inputs.max_age_days }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_ENRICH_ONLY: ${{ inputs.enrich_only }}
        run: |
          SHOW="${INPUT_SHOW:-all}"
          LIMIT="${INPUT_LIMIT:-1}"
          ARGS=(--show "$SHOW" --limit "$LIMIT")
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ "$INPUT_ENRICH_ONLY" = "true" ]; then
            ARGS=(--enrich "${ARGS[@]}")
          elif [ -n "$INPUT_MAX_AGE_DAYS" ]; then
            ARGS+=(--max-age-days "$INPUT_MAX_AGE_DAYS")
          fi
          echo "Running process.py with ${ARGS[*]}"
          python scripts/process.py "${ARGS[@]}"

      - name: Validate data contract
        run: |
          python scripts/validate_data.py --strict

      - name: Commit and push changes if updated
        run: |
          if [ -n "$(git status --porcelain docs/data)" ]; then
            echo "Changes detected in episode data. Committing and pushing..."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A docs/data
            git commit -m "chore(data): auto-update episodes and shows"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes in episode data. Skipping commit."
          fi
