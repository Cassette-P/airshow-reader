name: Scheduled Update and Ingestion

'on':
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      show:
        description: 'Target show to process (or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'airshow'
          - 'sinica'
      limit:
        description: 'Number of new episodes to process'
        required: false
        default: '1'
        type: string
      max_age_days:
        description: 'Max age of episodes in days (0 for no limit)'
        required: false
        default: '7'
        type: string
      dry_run:
        description: 'Dry run mode (do not call Gemini API or save data)'
        required: false
        default: false
        type: boolean
      enrich_only:
        description: 'Run --enrich backfill for existing episodes only'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: airshow-reader-update
  cancel-in-progress: false

jobs:
  update-episodes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies & ffmpeg
        run: |
          pip install -r requirements.txt
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Run processing pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_CH_B: ${{ vars.GEMINI_MODEL_CH_B }}
          GEMINI_MODEL_CH_A: ${{ vars.GEMINI_MODEL_CH_A }}
          GEMINI_MODEL_ENRICH: ${{ vars.GEMINI_MODEL_ENRICH }}
          GEMINI_THINKING_CH_B: ${{ vars.GEMINI_THINKING_CH_B }}
          GEMINI_THINKING_CH_A: ${{ vars.GEMINI_THINKING_CH_A }}
          GEMINI_THINKING_ENRICH: ${{ vars.GEMINI_THINKING_ENRICH }}
          CHUNK_SLEEP_SEC: ${{ vars.CHUNK_SLEEP_SEC }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHOW: ${{ inputs.show }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_MAX_AGE_DAYS: ${{ inputs.max_age_days }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_ENRICH_ONLY: ${{ inputs.enrich_only }}
        run: |
          SHOW="${INPUT_SHOW:-all}"
          LIMIT="${INPUT_LIMIT:-1}"
          MAX_AGE="${INPUT_MAX_AGE_DAYS:-7}"
          EXTRA_ARGS=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dry-run"
          fi
          if [ "$INPUT_ENRICH_ONLY" = "true" ]; then
            echo "Running process.py with --enrich --show $SHOW --limit $LIMIT $EXTRA_ARGS"
            python scripts/process.py --enrich --show "$SHOW" --limit "$LIMIT" $EXTRA_ARGS
          else
            echo "Running process.py with --show $SHOW --limit $LIMIT --max-age-days $MAX_AGE $EXTRA_ARGS"
            python scripts/process.py --show "$SHOW" --limit "$LIMIT" --max-age-days "$MAX_AGE" $EXTRA_ARGS
          fi

      - name: Validate data contract
        run: |
          python scripts/validate_data.py

      - name: Commit and push changes if updated
        run: |
          if [ -n "$(git status --porcelain docs/data)" ]; then
            echo "Changes detected in episode data. Committing and pushing..."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A docs/data
            git commit -m "chore(data): auto-update episodes and shows"
            git pull --rebase
            git push
          else
            echo "No changes in episode data. Skipping commit."
          fi
